---
- name: Update apt cache
  apt:
    update_cache: yes

- name: Install Python
  apt:
    name: python3
    state: present

- name: Install pip
  apt:
    name: python3-pip
    state: present

- name: Install Git
  apt:
    name: git
    state: present

- name: Install Docker
  apt:
    name: docker.io
    state: present

- name: Start Docker
  service:
    name: docker
    state: started
    enabled: yes